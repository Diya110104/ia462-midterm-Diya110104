name: security-pipeline

# Every third-party action is pinned to a full commit SHA (tag in the comment).
# Tags are mutable: in March 2026 an attacker force-pushed 76 of 77
# aquasecurity/trivy-action tags to credential-stealing code (GHSA-69fq-xp46-6x23).
# A SHA cannot be repointed. Dependabot (github-actions ecosystem) bumps these.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly re-scan for newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ia462-midterm:ci
  TRIVY_VERSION: v0.76.2

jobs:
  copies-in-sync:
    name: copies-in-sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Section folder copies match the originals
        run: bash midterm/scripts/sync-copies.sh --check

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pip-audit (exact pin)
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit requirements.txt (exact pins)
        working-directory: midterm
        run: pip-audit -r requirements.txt --no-deps --disable-pip --desc on
      - name: Audit requirements.lock (hash-locked)
        working-directory: midterm
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --desc on

  build-and-scan:
    name: build-and-scan
    runs-on: ubuntu-24.04
    needs: [pip-audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build hardened image
        working-directory: midterm
        run: docker build --pull -t "$IMAGE" .

      - name: Verify image runs as non-root
        run: |
          user=$(docker image inspect "$IMAGE" --format '{{.Config.User}}')
          echo "Config.User=$user"
          [ -n "$user" ] && [ "$user" != "root" ] && [ "$user" != "0" ]

      - name: Smoke test with hardened runtime flags + custom seccomp
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --security-opt seccomp=midterm/section3/seccomp-profile.json \
            -p 127.0.0.1:8000:8000 "$IMAGE"
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/whoami
          docker exec smoke id
          docker rm -f smoke

      - name: Trivy report (CRITICAL,HIGH,MEDIUM)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Trivy gate (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Syft SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-evidence
          path: |
            trivy-report.txt
            sbom.spdx.json
          retention-days: 30
